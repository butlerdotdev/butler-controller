# Bottlerocket - kubelet TLS bootstrap config for Steward TCP
# TCP: trustd-test at 10.40.0.214:6443 (v1.30.2)
#
# Bottlerocket does NOT use kubeadm. Kubelet is configured directly
# via settings.kubernetes.* and performs TLS bootstrapping using
# the bootstrap token to authenticate with the API server.
#
# Image: bottlerocket-metal-k8s-1.30 variant
# Download: https://updates.bottlerocket.aws/targets/
# Convert: unlz4 image.lz4 && qemu-img convert -f raw -O qcow2 image.img image.qcow2
#
# This TOML is written to partition 12 (BOTTLEROCKET-PRIVATE) as user-data.toml

[settings.kubernetes]
api-server = "https://10.40.0.214:6443"
cluster-certificate = ""
cluster-name = "trustd-test"
authentication-mode = "tls"
bootstrap-token = "13c53e.fb7d6c11b1ea9d8d"
cluster-domain = "cluster.local"
